<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>恐龍島大冒險</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1530;--panel:#2b2145;--panel2:#3a2d5c;--line:#6a54a8;--txt:#fff7e0;--gold:#ffd54a;--pink:#ff7aa8;--green:#6fe08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;margin:0;height:100%;background:#120c20;color:var(--txt);font-family:"DotGothic16","Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 4px #000,0 0 40px #0008}
.screen{position:fixed;inset:0;display:none;overflow:auto;background:radial-gradient(ellipse at top,#3a2a63,#150e26 70%);z-index:20;touch-action:pan-y}
.screen.show{display:block}
.screen.clear{background:#000a}
.wrap{max-width:980px;margin:0 auto;padding:16px;min-height:100%}
h1,h2,h3{margin:.2em 0;text-shadow:3px 3px 0 #000}
h1{font-size:clamp(28px,6vw,52px);color:var(--gold);text-align:center}
.btn{font:inherit;color:var(--txt);background:var(--panel2);border:3px solid #000;box-shadow:inset 0 -4px 0 #0005,inset 0 3px 0 #fff3;padding:10px 16px;font-size:18px;cursor:pointer;border-radius:6px;text-shadow:2px 2px 0 #000;touch-action:manipulation}
.btn:active{transform:translateY(2px)}
.btn.big{font-size:22px;padding:14px 26px}
.btn.pri{background:#e0447a}.btn.go{background:#2f9e5a}.btn.gold{background:#c98a12}
.btn.sel{background:#e0447a;outline:3px solid var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{text-align:center}
.menu{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:24px}
.card{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line);border-radius:10px;padding:14px}
/* creator */
.cre{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:10px}
@media(max-width:760px){.cre{grid-template-columns:1fr}}
.pvbox{text-align:center;position:sticky;top:8px;align-self:start}
.pvbox canvas{image-rendering:pixelated;background:linear-gradient(#8fd3ff,#d8f3ff 60%,#8fd36a 60%);border:4px solid #000;border-radius:8px;max-width:100%}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.row>b{width:84px;flex:none;color:var(--gold)}
.chip{font:inherit;font-size:15px;color:var(--txt);background:var(--panel2);border:2px solid #000;border-radius:5px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
.chip.sel{background:#e0447a;outline:2px solid var(--gold)}
.sw{width:26px;height:26px;border:3px solid #000;border-radius:4px;cursor:pointer;padding:0}
.sw.sel{outline:3px solid #fff}
input[type=color]{width:34px;height:30px;border:3px solid #000;border-radius:4px;padding:0;background:none}
input[type=range]{accent-color:#e0447a;width:150px;touch-action:pan-y}
.gender{display:flex;gap:12px;justify-content:center;margin:8px 0}
/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.item{display:flex;gap:10px;align-items:center}
.item .ic{font-size:34px;width:48px;text-align:center}
.item .tx{flex:1}
.pips{display:flex;gap:3px;margin:4px 0}
.pip{width:12px;height:12px;background:#0006;border:2px solid #000}
.pip.on{background:var(--gold)}
.stat{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:20px;margin:6px 0}
.big-gold{color:var(--gold);font-size:26px}
/* controls */
#controls{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#controls.show{display:block}
#joy{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:radial-gradient(#ffffff30,#ffffff14);border:4px solid #fff7;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(#fff,#cfd6ff);border:4px solid #0007;box-shadow:0 4px 0 #0005}
.dpad-mark{position:absolute;color:#fff9;font-size:16px;text-shadow:1px 1px 0 #000}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:210px;height:170px}
.ab{position:absolute;border-radius:50%;border:4px solid #000;color:#fff;font:inherit;font-size:18px;text-shadow:2px 2px 0 #000;pointer-events:auto;overflow:hidden;box-shadow:inset 0 -5px 0 #0006,inset 0 4px 0 #fff4;touch-action:none}
.ab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:#000a}
.ab span{position:relative;z-index:1}
#bA{right:0;bottom:30px;width:92px;height:92px;background:#e0447a;font-size:22px}
#bB{right:100px;bottom:90px;width:74px;height:74px;background:#f08a1c}
#bC{right:104px;bottom:6px;width:64px;height:64px;background:#2f8fe0;font-size:16px}
#topbtns{position:absolute;right:124px;top:8px;display:flex;gap:6px;pointer-events:auto}
#audiobar{position:fixed;right:8px;top:8px;display:flex;gap:6px;z-index:60}
#audiobar .btn,#topbtns .btn{padding:4px 10px;font-size:16px}
#audiobar .btn.off{opacity:.55;background:#555}
#topbtns .btn{padding:4px 10px;font-size:16px}
.screen,.screen *{touch-action:pan-y}
.screen .btn,.screen .chip,.screen .sw{touch-action:manipulation}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.lv{display:block;width:100%;text-align:center;line-height:1.5}
.lv small{display:block;font-size:13px;opacity:.9}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#000d;border:3px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:8px;z-index:50;display:none;font-size:18px;text-align:center;max-width:90vw;pointer-events:none;line-height:1.5}
.dlgwrap{position:absolute;left:0;right:0;bottom:0;padding:10px}
.dlg{max-width:780px;margin:0 auto;font-size:18px;line-height:1.7}
.dlgname{color:var(--gold);font-size:20px;margin-bottom:6px}
.dlgopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlgopts .btn{text-align:left;font-size:17px}
.gift{color:#7fe0ff;font-size:16px;display:block;margin-top:6px}
#sDialog{background:#0007}
.lv small b{color:var(--gold)}
.hint{font-size:14px;opacity:.8;text-align:center;margin-top:10px}
.big-title{font-size:20px;color:var(--pink)}
.tag{display:inline-block;background:#000a;border:2px solid var(--gold);color:var(--gold);padding:2px 8px;border-radius:4px;font-size:14px}
</style>
</head>
<body>
<div id="audiobar"><button class="btn" id="bMusic" title="音樂">🎵</button><button class="btn" id="bMute" title="音效">🔊</button></div>
<div id="stage"><canvas id="game" width="512" height="352"></canvas></div>

<div id="controls">
  <div id="topbtns"><button class="btn" id="bPause">⏸</button></div>
  <div id="joy"><div id="knob"></div>
    <div class="dpad-mark" style="left:62px;top:2px">▲</div><div class="dpad-mark" style="left:62px;bottom:2px">▼</div>
    <div class="dpad-mark" style="left:6px;top:58px">◀</div><div class="dpad-mark" style="right:6px;top:58px">▶</div></div>
  <div id="btns">
    <button class="ab" id="bB"><span>火球</span></button>
    <button class="ab" id="bA"><span>攻擊</span></button>
    <button class="ab" id="bC"><span>閃避</span></button>
  </div>
</div>

<!-- 標題 -->
<div class="screen show" id="sTitle"><div class="wrap center">
  <h1>🦖 恐龍島大冒險 🦕</h1>
  <p class="big-title">五座島 × 60 個關卡 × 五大魔王</p>
  <canvas id="titleCv" width="360" height="150" style="image-rendering:pixelated;max-width:100%"></canvas>
  <div class="menu">
    <button class="btn big go" id="mContinue">▶ 繼續冒險</button>
    <button class="btn big pri" id="mNew">✨ 新遊戲（捏臉）</button>
    <button class="btn" id="mEdit">🎨 修改我的外型</button>
    <button class="btn" id="mSave">💾 存檔代碼（換手機/電腦用）</button>
  </div>
  <p class="hint">電腦：方向鍵 / WASD 移動　J 或 空白鍵 攻擊　K 火球　L 或 Shift 閃避<br>手機：左邊搖桿（可八方向）、右邊按鈕</p>
</div></div>

<!-- 捏臉 -->
<div class="screen" id="sCreate"><div class="wrap">
  <h2 class="center">🎨 捏出你的冒險者</h2>
  <div class="gender">
    <button class="btn big" data-g="m">👦 男生</button>
    <button class="btn big" data-g="f">👧 女生</button>
  </div>
  <div class="cre">
    <div class="pvbox card">
      <canvas id="pvHead" width="240" height="340"></canvas>
      <canvas id="pvBody" width="180" height="210" style="margin-top:8px"></canvas>
      <div class="row" style="justify-content:center"><button class="btn" id="cRand">🎲 隨機</button></div>
    </div>
    <div class="card" id="cOpts"></div>
  </div>
  <div class="menu" style="flex-direction:row;justify-content:center;flex-wrap:wrap">
    <button class="btn" id="cBack">← 返回</button>
    <button class="btn big go" id="cDone">✔ 完成，出發！</button>
  </div>
</div></div>

<!-- 商店 -->
<div class="screen" id="sShop"><div class="wrap">
  <h2 class="center">🏪 恐龍島商店</h2>
  <div class="stat"><span>👵 婆婆的商店</span><span class="big-gold">💎 <b id="shGold">0</b></span></div>
  <div class="shop" id="shopList"></div>
  <div class="menu" style="flex-direction:row;justify-content:center;flex-wrap:wrap;margin-top:4px">
    <button class="btn" id="shEdit">🎨 修改外型</button>
    <button class="btn big go" id="shNext">離開商店</button>
  </div>
  <p class="hint" id="shHint"></p>
</div></div>

<!-- 對話 -->
<div class="screen" id="sDialog"><div class="dlgwrap"><div class="card dlg"><div class="dlgname" id="dlgName"></div><div id="dlgText"></div><div class="dlgopts" id="dlgOpts"></div></div></div></div>
<!-- 港口 -->
<div class="screen" id="sPort"><div class="wrap center"><h2>⛵ 港口 — 選擇目的地</h2><p class="hint" id="portHint"></p><div class="lvgrid" id="portGrid"></div><div class="menu"><button class="btn big" id="portBack">← 回村莊</button></div></div></div>
<!-- 存檔代碼 -->
<div class="screen" id="sSave"><div class="wrap center"><h2>💾 存檔代碼</h2>
<p class="hint">「產生代碼」會複製你的進度；到另一台裝置貼上後按「匯入代碼」，就能接著玩。</p>
<textarea id="saveText" rows="6" style="width:100%;max-width:640px;font-size:13px;background:#120c20;color:#fff7e0;border:3px solid #000;border-radius:6px;padding:8px;user-select:text;-webkit-user-select:text;touch-action:auto"></textarea>
<div class="menu" style="flex-direction:row;flex-wrap:wrap;justify-content:center"><button class="btn" id="svExport">📤 產生代碼</button><button class="btn" id="svImport">📥 匯入代碼</button><button class="btn" id="svBack">← 返回</button></div></div></div>
<!-- 選關 -->
<div class="screen" id="sLevels"><div class="wrap center">
  <h2 id="lvTitle"></h2><p id="lvDesc" class="hint"></p>
  <div class="lvgrid" id="lvGrid"></div>
  <div class="menu"><button class="btn big" id="lvBack">← 回村莊</button></div>
</div></div>
<div id="toast"></div>
<!-- 訊息 / 暫停 / 死亡 / 勝利 -->
<div class="screen clear" id="sMsg"><div class="wrap center" style="padding-top:12vh">
  <h1 id="msgT"></h1><p id="msgB" style="font-size:20px;line-height:1.7"></p>
  <div class="menu" id="msgBtns"></div>
</div></div>

<script>
'use strict';
/* ============ 小工具 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,f){const[r,g,b]=hex2rgb(h),m=f<0?0:255,t=Math.abs(f);return'#'+[r,g,b].map(v=>Math.round(v+(m-v)*t).toString(16).padStart(2,'0')).join('')}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ 音效 ============ */
let AC=null,muted=false,musicMuted=false;
try{muted=localStorage.getItem("dq_mute")==="1";musicMuted=localStorage.getItem("dq_music")==="0"}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',vol=.05,slide=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
const SFX={
 swing:()=>tone(520,.09,'triangle',.05,-300),hit:()=>tone(230,.1,'square',.06,-130),fire:()=>tone(300,.25,'sawtooth',.04,500),
 gem:()=>{tone(880,.06,'square',.03);setTimeout(()=>tone(1320,.08,'square',.03),50)},hurt:()=>tone(160,.35,'sawtooth',.08,-110),
 kill:()=>tone(420,.16,'square',.05,320),dash:()=>tone(200,.12,'triangle',.05,300),roar:()=>tone(90,.7,'sawtooth',.09,-40),
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.22,'square',.05),i*120)),
 buy:()=>{tone(660,.08,'square',.05);setTimeout(()=>tone(990,.12,'square',.05),70)},chest:()=>tone(180,.2,'square',.06,200)
};
let musicOn=false,mi=0;const SCALE=[262,294,330,392,440,523,440,392];
setInterval(()=>{if(!musicOn||muted||musicMuted||!AC)return;mi++;if(mi%2===0)tone(SCALE[(mi/2|0)%8]*(mi%16<8?1:1.5),.2,'triangle',.018)},230);

/* ============ 存檔 ============ */
const KEY='dinoQuestSave_v2',OLDKEY='dinoQuestSave_v1';
const DEF_LOOK={g:'m',species:0,shape:0,fw:0,skin:'#f6d3b3',hairStyle:0,hair:'#6b3f24',eyeStyle:0,eyeSize:2,eyeGap:2,eyeY:0,eye:'#3b82f6',browStyle:0,brow:'#4a2e1c',mouth:0,mouthY:0,blush:1,hat:0,hatColor:'#e0447a',glasses:0};
let save=null;
function loadSave(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.look)return s}catch(e){}
 try{const o=JSON.parse(localStorage.getItem(OLDKEY));if(o&&o.look)return newSave(o.look)}catch(e){}return null}
function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function migrate(s){
 if(!s.up)s.up={weapon:0,armor:0,boots:0,fire:0,magnet:0};
 if(!s.cleared)s.cleared={};
 if(!s.boss)s.boss={};if(!s.flags)s.flags={};if(!s.opened)s.opened={};
 if(s.boss1){s.boss[1]=true;delete s.boss1}
 if(s.boss2){s.boss[5]=true;delete s.boss2}
 if(!s.v||s.v<3){if(s.island===2)s.island=5;s.v=3}
 if(!s.island)s.island=1;
 s.look=Object.assign({},DEF_LOOK,s.look);
 return s}
function newSave(look){return{look,gold:0,up:{weapon:0,armor:0,boots:0,fire:0,magnet:0},cleared:{},island:1,boss:{},flags:{},opened:{},v:3,kills:0,gems:0}}

/* ============ 像素精靈工具 ============ */
const OUT='#2b1d2e';
function mkSprite(w,h,draw,ax,ay,pad=3){
 const s=document.createElement('canvas');s.width=w+pad*2;s.height=h+pad*2;const c=s.getContext('2d');c.imageSmoothingEnabled=false;
 c.translate(pad,pad);draw(c);c.setTransform(1,0,0,1,0,0);
 const o=document.createElement('canvas');o.width=s.width;o.height=s.height;const oc=o.getContext('2d');
 for(const[dx,dy]of[[-2,0],[2,0],[0,-2],[0,2]])oc.drawImage(s,dx,dy);
 oc.globalCompositeOperation='source-in';oc.fillStyle=OUT;oc.fillRect(0,0,o.width,o.height);
 oc.globalCompositeOperation='source-over';oc.drawImage(s,0,0);
 return{c:o,ax:ax+pad,ay:ay+pad,w:o.width,h:o.height};
}
function drawSp(ctx,sp,x,y,flip,alpha){
 x=Math.round(x);y=Math.round(y);
 if(alpha!=null)ctx.globalAlpha=alpha;
 if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(sp.c,-sp.ax,-sp.ay);ctx.restore()}
 else ctx.drawImage(sp.c,x-sp.ax,y-sp.ay);
 if(alpha!=null)ctx.globalAlpha=1;
}
function mkR(c,u,ox,oy){
 const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(ox+x*u),Math.round(oy+y*u),w*u,h*u)};
 const E=(cx,cy,rx,ry,col)=>{c.fillStyle=col;for(let j=-ry;j<=ry;j++)for(let i=-rx;i<=rx;i++)if(i*i/(rx*rx+.6)+j*j/(ry*ry+.6)<=1)c.fillRect(Math.round(ox+(cx+i)*u),Math.round(oy+(cy+j)*u),u,u)};
 return{R,E};
}

/* ============ 玩家外觀 ============ */
const SHAPES=[[6,8,10,10,10,10,10,10,10,8,6],[8,10,10,10,10,10,10,10,10,10,8],[8,10,10,10,10,10,8,8,6,6,4]];
function faceW(look){return SHAPES[look.shape].map(w=>clamp(w+look.fw*2,4,14))}
function drawHead(r,look,dir){
 const wd=faceW(look),cx=7,hc=look.hair,hi=shade(hc,.25),sk=look.skin,st=look.hairStyle|0,spc=look.species|0;
 const none=st===13;
 const span=(row,w,col)=>r(cx-w/2,row,w,1,col);
 const dx=dir==='left'?-1:dir==='right'?1:0;
 function hat(){
  const h=look.hat|0;if(!h)return;const hcol=look.hatColor||'#e0447a',hd=shade(hcol,-.25),hl=shade(hcol,.3);
  if(h===1){r(2,-2,10,3,hcol);r(5,-3,4,1,hcol);r(3,-2,3,1,hl);if(dir!=='up'){const bx=dir==='left'?0:dir==='right'?5:1,bw=dir==='down'?12:9;r(bx,1,bw,1,hd)}}
  else if(h===2){r(2,-3,10,4,hcol);r(3,-4,8,1,hcol);r(4,-3,1,3,hl);r(7,-3,1,3,hl);r(10,-3,1,3,hl);r(1,0,12,2,hd);r(6,-6,2,2,'#fff');r(5,-5,1,1,'#fff');r(8,-5,1,1,'#fff')}
  else if(h===3){r(4,-4,6,3,hcol);r(3,-3,1,2,hcol);r(10,-3,1,2,hcol);r(-1,-1,16,2,hd);r(-1,-2,2,1,hd);r(13,-2,2,1,hd);r(4,-2,6,1,'#8b5a2b')}
  else if(h===4){const g='#ffd54a';r(3,-3,8,3,g);r(3,-5,2,2,g);r(6,-6,2,3,g);r(9,-5,2,2,g);r(3,-1,8,1,'#c98a12');r(6,-2,2,1,'#e0447a');r(4,-2,1,1,'#7fe0ff');r(9,-2,1,1,'#7fe0ff')}
  else if(h===5){r(0,-1,14,2,hd);r(3,-3,8,2,hcol);r(4,-5,6,2,hcol);r(5,-7,4,2,hcol);r(6,-9,3,2,hcol);r(8,-10,3,1,hcol);r(6,-3,2,1,'#ffd54a');r(9,-6,1,1,'#ffd54a');r(3,-2,8,1,hd)}
 }
 function ears(){
  if(spc===2){const pk='#ff9db0';r(2,-3,1,1,sk);r(2,-2,2,1,sk);r(2,-1,3,1,sk);r(3,-1,1,1,pk);r(11,-3,1,1,sk);r(10,-2,2,1,sk);r(9,-1,3,1,sk);r(10,-1,1,1,pk)}

function updateEnemies(dt){
 for(const q of G.spawnQ)q.delay-=dt;
 let alive=G.enemies.reduce((a,e)=>a+(e.dead?0:1),0);
 for(let i=0;i<G.spawnQ.length&&alive<G.maxAlive;){
  if(G.spawnQ[i].delay>0){i++;continue}
  const q=G.spawnQ.splice(i,1)[0];let x,y,k=0;
  do{x=rnd(40,WW-40);y=rnd(TOP+40,WH-30);k++}while(k<40&&(Math.hypot(x-P.x,y-P.y)<170||blocked(x,y,12,8)));
  G.enemies.push(mkEnemy(q.t,x,y,.9,q.opt));alive++;
 }
 for(const e of G.enemies){
  if(e.dead)continue;const d=DEFS[e.type],ai=d.ai;
  e.flash=Math.max(0,e.flash-dt);
  if(e.spawn>0){e.spawn-=dt;if(Math.random()<.4)fx(e.x,e.y,'#fff7d0',1,30,.4,3);continue}
  e.ft+=dt;if(e.ft>(d.fly?.15:.22)){e.ft=0;e.fr^=1}
  if(e.boss){bossAI(e,dt);continue}
  const px=P.x,py=pcy(),dx=px-e.x,dy=py-ecy(e),dist=Math.hypot(dx,dy)||1;
  let vx=0,vy=0,spd=d.spd*Math.min(1.6,1+((G.diff||1)-1)*.03)*(e.elite?1.25:1)*(e.mini?.85:1);
  e.t-=dt;e.cd-=dt;
  if(e.stun>0){e.stun-=dt}
  else if(ai==='wander'){
   if(e.t<=0){e.t=rnd(1,2);e.dir=Math.random()<.5?Math.atan2(dy,dx):rnd(0,6.28)}
   vx=Math.cos(e.dir)*spd;vy=Math.sin(e.dir)*spd;
  }else if(ai==='chase'){
   if(e.st==='idle'){vx=dx/dist*spd;vy=dy/dist*spd;if(e.t<=0){e.st='pause';e.t=.4}}
   else if(e.t<=0){e.st='idle';e.t=rnd(1.2,2.4)}
  }else if(ai==='charge'){
   if(e.st==='idle'){vx=dx/dist*spd*.7;vy=dy/dist*spd*.7;
    if(e.cd<=0&&dist<170){e.st='wind';e.t=.6;e.dir=Math.atan2(dy,dx)}}
   else if(e.st==='wind'){if(e.t<=0){e.st='charge';e.t=.7;e.dir=Math.atan2(py-ecy(e),px-e.x)}}
   else if(e.st==='charge'){const cs=e.type==='pachy'?240:(e.type==='trilo'||e.type==='scorp')?215:190;vx=Math.cos(e.dir)*cs;vy=Math.sin(e.dir)*cs;if(e.t<=0||e.hit){e.st='rest';e.t=1;e.cd=2.2}}
   else if(e.st==='rest'&&e.t<=0)e.st='idle';
  }else if(ai==='shoot'){
   vx=dx/dist*spd;vy=dy/dist*spd;
   if(dist<110){vx*=-.6;vy*=-.6}
   if(e.cd<=0){e.cd=Math.max(1.2,2.6-(G.diff||1)*.06);const a=Math.atan2(dy,dx);G.eshots.push({x:e.x,y:ecy(e),vx:Math.cos(a)*85,vy:Math.sin(a)*85,dmg:1,r:5,col:d.col||'#ff9bd0',life:5})}
  }else if(ai==='dive'){
   if(e.st==='idle'){
    e.ang+=dt*1.3;const tx=px+Math.cos(e.ang)*95,ty=py+Math.sin(e.ang)*60;
    const l=Math.hypot(tx-e.x,ty-ecy(e))||1;vx=(tx-e.x)/l*spd;vy=(ty-ecy(e))/l*spd;
    if(e.cd<=0){e.st='wind';e.t=.55}
   }else if(e.st==='wind'){if(e.t<=0){e.st='dive';e.t=.9;e.dir=Math.atan2(py-ecy(e),px-e.x)}}
   else if(e.st==='dive'){vx=Math.cos(e.dir)*210;vy=Math.sin(e.dir)*210;if(e.t<=0){e.st='idle';e.cd=rnd(1.6,3.2)}}
  }
  e.hit=false;
  vx+=e.kx;vy+=e.ky;e.kx*=.82;e.ky*=.82;

   else{e.kx-=dx/dist*30;e.ky-=dy/dist*30}

 }

 for(let i=0;i<G.enemies.length;i++)for(let j=i+1;j<G.enemies.length;j++){
  const a=G.enemies[i],b=G.enemies[j];if(a.dead||b.dead||a.boss||b.boss||a.spawn>0||b.spawn>0||(!!a.z)!==(!!b.z))continue;

 G.enemies=G.enemies.filter(e=>!e.dead);
}

 const wins=(a)=>{e.st=a};

 switch(e.st){

   face();const s=DEFS[e.type].spd*(enr?1.45:1);moveEnt(e,dx/dist*s*dt,dy/dist*s*dt,18,8);

  case'cwind':

   if(e.t<=0){e.st='charge';e.t=.95;SFX.roar();e.lock=e.dir}break;
  case'charge':{
   const s=330;moveEnt(e,Math.cos(e.lock)*s*dt,Math.sin(e.lock)*s*dt,18,8);e.face=Math.cos(e.lock)>0?1:-1;

   if(e.hit||e.t<=0){shake=10;

  }break;

    if(Math.hypot(px-e.x,P.y-e.y)<42)hurtPlayer(100,dx/dist*220,dy/dist*220);
    e.st='rest';e.t=1.3}
   break;
  case'spit':
   e.sc-=dt;face();
   if(e.sc<=0){e.sc=enr?.2:.28;e.ang+=.55;SFX.fire();
    const nn=(DEFS[e.type].spit||2)+(enr?1:0);
    for(let k=0;k<nn;k++){const a=e.ang+k*(6.28/nn);G.eshots.push({x:e.x+e.face*28,y:e.y-34,vx:Math.cos(a)*125,vy:Math.sin(a)*125,dmg:100,r:8,col:DEFS[e.type].col||'#ff8a3d',life:6})}}
   if(e.t<=0){e.st='rest';e.t=1.2}break;
  case'rain':

   if(e.rc<=0){e.rc=enr?.17:.22;const a=rnd(0,6.28),rr=rnd(0,90);G.marks.push({x:clamp(px+Math.cos(a)*rr,20,WW-20),y:clamp(P.y+Math.sin(a)*rr*.7,TOP+10,WH-20),t:1.1})}
   if(e.t<=0){e.st='rest';e.t=1.1}break;

 }

/* 更新 */
function update(dt){
 G.t+=dt;if(G.banner>0)G.banner-=dt;
 shake=Math.max(0,shake-dt*30);
 /* 玩家 */
 if(mode==='play'){
  P.inv=Math.max(0,P.inv-dt);P.atkCd-=dt;P.skCd-=dt;P.dashCd-=dt;P.atkT-=dt;

  if(P.dashT>0){P.dashT-=dt;moveEnt(P,P.dvx*300*dt,P.dvy*300*dt,5,3);if(Math.random()<.6)fx(P.x,P.y-6,'#cfe8ff',1,20,.3,4)}
  else{
   const sp=84*spdMul();
   if(ix||iy){P.fx=ix;P.fy=iy;setDirFromVec();P.walk+=dt*9}
   moveEnt(P,ix*sp*dt+P.kx*dt,iy*sp*dt+P.ky*dt,5,3);
  }
  P.kx*=.8;P.ky*=.8;
  if(wantAtk()&&P.atkCd<=0&&!(G.hub&&G.near))doAttack();
  if(wantSk()&&P.skCd<=0)doSkill();
  if(wantDash()&&P.dashCd<=0&&P.dashT<=0)doDash();
 }
 if(G.hub&&mode==='play')hubLogic();
 if(mode==='play'||mode==='won')updateEnemies(dt);
 /* 火球 */
 for(const s of G.shots){
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  if(Math.random()<.7)fx(s.x,s.y,Math.random()<.5?'#ffb03a':'#ff5a2a',1,25,.3,3);
  if(s.x<4||s.x>WW-4||s.y<TOP||s.y>WH)s.life=0;
  for(const o of G.obs){if(!o.dead&&Math.abs(s.x-o.x)<o.w/2+3&&Math.abs(s.y-(o.y-6))<o.h/2+8){if(o.chest){hitChest(o)}s.life=0}}
  for(const e of G.enemies){
   if(e.dead||e.spawn>0||s.hit.has(e.id))continue;
   if(Math.hypot(s.x-e.x,s.y-ecy(e))<e.r+s.r){s.hit.add(e.id);damageEnemy(e,s.dmg,s.vx/250,s.vy/250,true);if(!s.pierce)s.life=0;fx(s.x,s.y,'#ff8a3a',8,90,.4,4)}
  }
 }
 G.shots=G.shots.filter(s=>s.life>0);
 /* 敵彈 */
 for(const s of G.eshots){
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  if(s.x<4||s.x>WW-4||s.y<TOP||s.y>WH)s.life=0;
  for(const o of G.obs)if(!o.dead&&!o.chest&&Math.abs(s.x-o.x)<o.w/2+3&&Math.abs(s.y-(o.y-4))<o.h/2+6)s.life=0;
  if(mode==='play'&&Math.hypot(s.x-P.x,s.y-pcy())<s.r+6){hurtPlayer(s.dmg,s.vx*.5,s.vy*.5);s.life=0}
 }
 G.eshots=G.eshots.filter(s=>s.life>0);
 /* 衝擊波 */
 for(const r of G.rings){
  r.r+=230*dt;
  if(mode==='play'&&!r.hit&&r.r>0){const d=Math.hypot(P.x-r.x,(P.y-r.y)*1.3);if(Math.abs(d-r.r)<10){r.hit=true;hurtPlayer(100,(P.x-r.x)/d*200,(P.y-r.y)/d*200)}}
 }
 G.rings=G.rings.filter(r=>r.r<r.max);
 /* 寶石 */
 for(const g of G.gems){
  g.age+=dt;
  if(g.age<.5||g.z>0||g.vz>0){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vz-=300*dt;g.z=Math.max(0,g.z+g.vz*dt);if(g.z===0&&g.vz<0){g.vz=0;g.vx*=.3;g.vy*=.3}g.x=clamp(g.x,10,WW-10);g.y=clamp(g.y,TOP,WH-8)}
  if(mode==='play'||mode==='won'){
   const d=Math.hypot(P.x-g.x,pcy()+8-g.y);
   if(g.age>.4&&d<magR()){g.x+=(P.x-g.x)/d*180*dt;g.y+=(pcy()+8-g.y)/d*180*dt}
   if(g.age>.25&&d<14&&mode==='play'){
    g.take=true;
    if(g.t<0){P.hp=Math.min(P.maxhp,P.hp+(isBoss(G.n)?0:1));txt(P.x,P.y-40,'+♥','#ff7aa8');SFX.gem()}
    else{save.gold+=g.val;G.earned+=g.val;save.gems++;SFX.gem();txt(P.x,P.y-40,'+'+g.val,'#7fe0ff')}
   }
  }
 }
 G.gems=G.gems.filter(g=>!g.take);
 G.obs=G.obs.filter(o=>!o.dead);
 /* 冰錐 */
 for(const m of G.marks){m.t-=dt;if(m.t<=0){m.done=true;fx(m.x,m.y,'#bfe8ff',14,100,.5,4);SFX.hit();shake=Math.max(shake,5);if(mode==='play'&&Math.hypot(P.x-m.x,(P.y-m.y)*1.2)<22)hurtPlayer(100,0,0)}}
 G.marks=G.marks.filter(m=>!m.done);
 /* 粒子與文字 */
 for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;f.life-=dt}G.fx=G.fx.filter(f=>f.life>0);
 for(const t of G.txt){t.y-=24*dt;t.t-=dt}G.txt=G.txt.filter(t=>t.t>0);
 /* 過關 */
 if(mode==='play'&&!G.hub&&!isBoss(G.n)&&!G.cleared&&!G.spawnQ.length&&!G.enemies.length&&G.t>2){
  G.cleared=true;G.ticket={x:WW/2,y:WH/2,t:0};SFX.win();
  const bonus=10+2*G.diff;save.gold+=bonus;G.earned+=bonus;txt(WW/2,WH/2-30,'關卡完成！+'+bonus,'#ffd54a');
  G.banner=0;writeSave();
 }
 if(G.ticket){
  G.ticket.t+=dt;
  if(mode==='play'&&Math.hypot(P.x-G.ticket.x,P.y-G.ticket.y)<22){mode='ticket';G.ticket.got=true;G.over=0;SFX.win();fx(G.ticket.x,G.ticket.y,'#ffd54a',30,140,1,4);save.cleared[G.n]=true;writeSave();const nn=G.n,isl=G.info.isl,tot=islTotal(isl);setTimeout(()=>{save.island=isl;const c=clearedCount(isl);enterHub(c>=tot?'🎉 '+ISL[isl].name+'全部通關！去「王座之門」挑戰'+ISL[isl].bossName+'！':'🎫 '+lvlName(nn)+' 通關！（'+c+'/'+tot+'）')},1800)}
 }
 if(mode==='ticket'||mode==='dead'||mode==='won')G.over+=dt;
}

 {t:'chips',k:'hat',l:'帽子',o:['無','棒球帽','毛帽','牛仔帽','皇冠','巫師帽']},
 {t:'color',k:'hatColor',l:'帽子顏色',p:HATCOLS},
 {t:'chips',k:'glasses',l:'眼鏡',o:['無','墨鏡','圓框眼鏡','粉紅墨鏡','海盜眼罩']}
];
let cLook=null,cIsNew=true,cFrame=0,cTimer=null;
function openCreate(isNew,fromShop){
 cIsNew=isNew;cFromShop=!!fromShop;
 cLook=Object.assign({},DEF_LOOK,JSON.parse(JSON.stringify(isNew?DEF_LOOK:save.look)));
 showScreen('#sCreate');buildCreateUI();drawCreate();
 clearInterval(cTimer);cTimer=setInterval(()=>{if(!$('#sCreate').classList.contains('show')){clearInterval(cTimer);return}cFrame++;drawCreatePreview()},300);
}
let cFromShop=false;
function genderDefaults(g){
 if(g==='f')Object.assign(cLook,{g:'f',hairStyle:1,hair:'#6b3f24',eyeStyle:2,eyeSize:3,shape:0,browStyle:0,mouth:0,blush:1});
 else Object.assign(cLook,{g:'m',hairStyle:0,hair:'#2a1a14',eyeStyle:0,eyeSize:2,shape:1,browStyle:1,mouth:1,blush:0});
 if(cLook.species>0)cLook.hairStyle=13;
}
function buildCreateUI(){
 $$('.gender .btn').forEach(b=>b.classList.toggle('sel',b.dataset.g===cLook.g));
 const box=$('#cOpts');box.innerHTML='';
 for(const o of CRE){
  const row=document.createElement('div');row.className='row';row.innerHTML='<b>'+o.l+'</b>';
  if(o.t==='chips')o.o.forEach((name,i)=>{const b=document.createElement('button');b.className='chip'+(cLook[o.k]===i?' sel':'');b.textContent=name;b.onclick=()=>{cLook[o.k]=i;if(o.k==='species'){if(i>0)cLook.hairStyle=13;else if(cLook.hairStyle===13)cLook.hairStyle=cLook.g==='f'?1:0}buildCreateUI();drawCreate()};row.appendChild(b)});
  else if(o.t==='range'){const r=document.createElement('input');r.type='range';r.min=o.min;r.max=o.max;r.step=1;r.value=cLook[o.k];r.oninput=()=>{cLook[o.k]=+r.value;drawCreate()};row.appendChild(r)}
  else{
   o.p.forEach(c=>{const b=document.createElement('button');b.className='sw'+(cLook[o.k]===c?' sel':'');b.style.background=c;b.onclick=()=>{cLook[o.k]=c;buildCreateUI();drawCreate()};row.appendChild(b)});
   const ci=document.createElement('input');ci.type='color';ci.value=cLook[o.k];ci.oninput=()=>{cLook[o.k]=ci.value;drawCreate()};ci.onchange=()=>buildCreateUI();row.appendChild(ci);
  }
  box.appendChild(row);
 }
}
function drawCreate(){
 const c=$('#pvHead').getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,240,340);
 const s=12,ox=36,oy=130;
 const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(ox+x*s,oy+y*s,w*s,h*s)};
 /* 肩膀 */
 const tc=cLook.g==='f'?'#ff7fa8':'#4a90e2';
 c.fillStyle=tc;c.fillRect(ox+3*s,oy+11*s,8*s,5*s);c.fillStyle=shade(tc,.25);c.fillRect(ox+3*s,oy+11*s,8*s,s);
 drawHead(r,cLook,'down');
 drawCreatePreview();
}
function drawCreatePreview(){
 const c=$('#pvBody').getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,180,210);
 const sv=save;save={look:cLook,up:(save&&save.up)||{weapon:0,armor:0,boots:0,fire:0,magnet:0}};
 const old=PCACHE;PCACHE={};
 const dirs=['down','right','up','left'],dir=dirs[(cFrame/4|0)%4],sp=playerSprite(dir,cFrame%2?1:2);
 PCACHE=old;save=sv;
 c.drawImage(sp.c,0,0,sp.w*2.5,sp.h*2.5);
}
$$('.gender .btn').forEach(b=>b.onclick=()=>{genderDefaults(b.dataset.g);buildCreateUI();drawCreate()});
$('#cRand').onclick=()=>{
 const g=Math.random()<.5?'m':'f';genderDefaults(g);
 Object.assign(cLook,{shape:rint(0,2),fw:rint(-1,1),skin:pick(SKINS),hairStyle:rint(0,13),hair:pick(HAIRS),eyeStyle:rint(0,2),eyeSize:rint(2,3),eyeGap:rint(1,3),eyeY:rint(-1,1),eye:pick(EYES),browStyle:rint(0,2),brow:pick(BROWS),mouth:rint(0,2),mouthY:rint(-1,1),blush:rint(0,1),species:Math.random()<.3?rint(1,2):0,hat:rint(0,5),hatColor:pick(HATCOLS),glasses:rint(0,4)});
 if(cLook.species>0)cLook.hairStyle=13;
 buildCreateUI();drawCreate();
};
$('#cBack').onclick=()=>{clearInterval(cTimer);cFromShop?openShop():toTitle()};
$('#cDone').onclick=()=>{
 clearInterval(cTimer);
 if(cIsNew){save=newSave(cLook);writeSave();invalidate();showMsg('📜 龍之石的傳說','很久很久以前，世界上有一顆守護大海與大地的「龍之石」。<br>有一天，五位魔王把它打碎，每人搶走一塊，藏在五座島上。<br><br>你是被選中的冒險者！<br>從恐龍島出發，打敗魔王、集齊五塊碎片，拯救世界吧！',[['出發！','go',()=>enterHub('歡迎來到恐龍村！走到洞穴、婆婆或爺爺旁邊，按「攻擊」互動')]])}
 else{save.look=cLook;writeSave();invalidate();cFromShop?(openShop()):toTitle()}
};

/* ---- 標題 ---- */
function drawTitleArt(){
 const c=$('#titleCv'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
 const g=x.createLinearGradient(0,0,0,150);g.addColorStop(0,'#8fd3ff');g.addColorStop(1,'#e8f8ff');x.fillStyle=g;x.fillRect(0,0,360,150);
 x.fillStyle='#79c957';x.fillRect(0,110,360,40);x.fillStyle='#6fbf50';for(let i=0;i<360;i+=32)x.fillRect(i,110,16,40);
 x.fillStyle='#ff7a2a';x.beginPath();x.arc(310,30,18,0,6.28);x.fill();
 const draw=(t,fr,px,py,flip,sc=2)=>{const sp=dinoSprite(t,fr);x.save();x.translate(px,py);if(flip)x.scale(-1,1);x.scale(sc/2,sc/2);x.drawImage(sp.c,-sp.ax,-sp.ay);x.restore()};
 draw('bronto',0,60,130,false,3);draw('tric',1,150,138,false,3);draw('stego',0,250,132,true,3);draw('ptero',1,120,60,false,3);draw('ptero',0,290,70,true,2);draw('raptor',0,330,140,true,3);
}
$('#mNew').onclick=()=>{ac();openCreate(true)};
$('#mEdit').onclick=()=>{ac();openCreate(false)};
$('#mContinue').onclick=()=>{ac();enterHub()};
$('#bPause').onclick=togglePause;
function syncAudioUI(){$('#bMute').textContent=muted?'🔇':'🔊';$('#bMute').classList.toggle('off',muted);$('#bMusic').textContent=musicMuted?'🎵✕':'🎵';$('#bMusic').classList.toggle('off',musicMuted||muted)}
$('#bMute').onclick=()=>{muted=!muted;try{localStorage.setItem('dq_mute',muted?'1':'0')}catch(e){}syncAudioUI()};
$('#bMusic').onclick=()=>{musicMuted=!musicMuted;try{localStorage.setItem('dq_music',musicMuted?'0':'1')}catch(e){}syncAudioUI()};
syncAudioUI();

/* ============ 啟動 ============ */
save=loadSave();
if(save)migrate(save);
toTitle();drawTitleArt();
document.fonts&&document.fonts.ready.then(drawTitleArt);
window.__dbg={dlg:DLG,levelInfo,ISL,openPort,openDialog,showNode,step:(n=1,dt=1/60)=>{for(let i=0;i<n;i++)update(dt);draw()},enterHub,interact,startLevel,get G(){return G},get P(){return P},get save(){return save},openShop};
</script>
</body>
